name: SkyCastle Auto Renew

on:
  schedule:
    # 每天 UTC 04:00 执行一次（即北京时间中午 12:00，间隔 24 小时）
    - cron: '10 2 */3 * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖 (Xvfb 虚拟屏幕)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-wqy-zenhei

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase

      - name: 安装 Chrome 驱动
        run: |
          seleniumbase install chromedriver

      - name: 执行续期脚本
        env:
          SKYCASTLE_EMAIL: ${{ secrets.SKYCASTLE_EMAIL }}
          SKYCASTLE_PASSWORD: ${{ secrets.SKYCASTLE_PASSWORD }}
          SKYCASTLE_TOKEN: ${{ secrets.SKYCASTLE_TOKEN }}
          SKYCASTLE_TOTP: ${{ secrets.SKYCASTLE_TOTP }}
          SKYCASTLE_PANEL: ${{ secrets.SKYCASTLE_PANEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          SKYCASTLE_TURNSTILE_SITEKEY: ${{ secrets.SKYCASTLE_TURNSTILE_SITEKEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 上传运行截图附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skycastle-run-artifacts
          path: .skycastle-cache/
          retention-days: 3

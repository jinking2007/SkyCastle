name: SkyCastle renewal

# Runs daily. The script only acts when a server is inside the renewal window
# (default: 36h before its due date), so in practice it renews roughly every
# 3 days — without ever needing you to be present.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options:
          - check
          - recon
          - sniff
          - discover
          - dump
          - renew
        default: check

concurrency:
  group: skycastle-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Required: SKYCASTLE_API_KEY  (repository secret)
    # Optional: TG 2 + panel/behaviour overrides (empty values are ignored)
    env:
      SKYCASTLE_API_KEY: ${{ secrets.SKYCASTLE_API_KEY }}
      SKYCASTLE_PANEL: ${{ vars.SKYCASTLE_PANEL }}
      SKYCASTLE_RENEW_BEFORE_HOURS: ${{ vars.SKYCASTLE_RENEW_BEFORE_HOURS }}
      SKYCASTLE_RENEW_PATH: ${{ vars.SKYCASTLE_RENEW_PATH }}
      SKYCASTLE_DRY_RUN: ${{ vars.SKYCASTLE_DRY_RUN }}
      SKYCASTLE_TIMEOUT: ${{ vars.SKYCASTLE_TIMEOUT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the script uses only the standard library.

      - name: Discover renewal endpoint
        if: github.event.inputs.mode == 'discover'
        run: python scripts/skycastle-renew.py --discover

      - name: Recon (read-only billing sweep)
        if: github.event.inputs.mode == 'recon'
        run: python scripts/skycastle-renew.py --recon

      - name: Sniff the renewal endpoint from the panel front-end
        if: github.event.inputs.mode == 'sniff'
        env:
          SKYCASTLE_TOKEN: ${{ secrets.SKYCASTLE_TOKEN }}
          SKYCASTLE_SNIFF_PAGES: ${{ vars.SKYCASTLE_SNIFF_PAGES }}
        run: python scripts/skycastle-renew.py --sniff

      - name: Dump server objects
        if: github.event.inputs.mode == 'dump'
        run: python scripts/skycastle-renew.py --dump

      - name: Dry run (report only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'check'
        run: python scripts/skycastle-renew.py --check

      - name: Renew if due
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'renew'
        run: python scripts/skycastle-renew.py
